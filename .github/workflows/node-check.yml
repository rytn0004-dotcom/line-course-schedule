name: Node syntax and parser tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check server.js
      - name: Check pure parsing rules syntax
        run: node --check source_note_rules.js
      - name: Run timetable parser rule tests
        run: npm test
